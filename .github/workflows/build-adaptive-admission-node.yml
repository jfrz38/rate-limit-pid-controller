name: Build Adaptive Admission Node Host

on:
    pull_request:
        branches: [main, develop, migrate/adaptive-admission]
        paths:
            - "code/hosts/node/**"
            - "code/package.json"
            - "code/pnpm-lock.yaml"
            - "code/pnpm-workspace.yaml"
            - "code/tsconfig.json"
            - "Makefile"
            - ".github/workflows/build-adaptive-admission-node.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    RUST_TOOLCHAIN: "1.99.0"
    WASM_TOOLS_VERSION: "1.262.0"

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6.1.0
              with:
                  version: 11.1.3

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: code/pnpm-lock.yaml

            - name: Cache pinned wasm-tools binary
              uses: actions/cache@v6
              with:
                  path: ~/.cargo/bin/wasm-tools
                  key: wasm-tools-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ env.WASM_TOOLS_VERSION }}

            - name: Install workspace dependencies
              run: make install-code

            - name: Install pinned Rust component tools
              run: make install-node-component-tools

            - name: Rebuild stable crates.io component
              run: make verify-node-component

            - name: Build Node host and validate component provenance
              run: make build-node

            - name: Lint Node host
              run: make lint-node

            - name: Test Node host
              run: make test-node

            - name: Run component conformance
              run: make test-node-conformance

            - name: Smoke test installed package tarball
              run: make test-node-package
