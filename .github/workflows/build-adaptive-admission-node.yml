name: Build Adaptive Admission Node Host

on:
    pull_request:
        branches: [main, develop]
        paths:
            - "code/hosts/node/**"
            - "code/package.json"
            - "code/pnpm-lock.yaml"
            - "code/pnpm-workspace.yaml"
            - "code/tsconfig.json"
            - "Makefile"
            - ".github/workflows/build-adaptive-admission-node.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6.0.10
              with:
                  version: 11.1.3

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: code/pnpm-lock.yaml

            - name: Validate Node host package
              run: make validate-node
