name: Create Releases

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    name: Create ${{ matrix.package.release_name }} release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        package:
          - release_name: express
            package_key: express
            tag_prefix: express-v
            package_name: "@jfrz38/pid-controller-express"
            package_dir: code/adapters/express
            package_file: code/adapters/express/package.json
          - release_name: nestjs
            package_key: nestjs
            tag_prefix: nestjs-v
            package_name: "@jfrz38/pid-controller-nestjs"
            package_dir: code/adapters/nestjs
            package_file: code/adapters/nestjs/package.json
          - release_name: node
            package_key: node
            tag_prefix: node-v
            package_name: "@jfrz38/adaptive-admission-node"
            package_dir: code/hosts/node
            package_file: code/hosts/node/package.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: publication-policy
        name: Check component publication policy
        env:
          PACKAGE_KEY: ${{ matrix.package.package_key }}
        run: |
          if [ "$PACKAGE_KEY" != "node" ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBLISHABLE="$(node -p "require('./code/hosts/node/component/COMPONENT.json').publishable")"
          echo "publishable=$PUBLISHABLE" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHABLE" != "true" ]; then
            echo "Node release skipped: the embedded component is not publishable."
          fi

      - id: version-check
        name: Check version is releasable
        if: steps.publication-policy.outputs.publishable == 'true'
        uses: jfrz38/check-version-change@v1.6.0
        with:
          file-path: ${{ matrix.package.package_file }}
          package-name: ${{ matrix.package.package_name }}
          compare-source: registry
          registry: npm

      - name: Skip already published version
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed != 'true'
        working-directory: .
        run: |
          echo "${{ matrix.package.package_name }} ${{ steps.version-check.outputs.local-version }} is already published to npm; no release to create."

      - name: Verify version can be released
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        working-directory: .
        run: |
          if [ -n "${{ steps.version-check.outputs.compared-version }}" ] && [ "${{ steps.version-check.outputs.is-higher }}" != "true" ]; then
            echo "Version ${{ steps.version-check.outputs.local-version }} is not higher than published version ${{ steps.version-check.outputs.compared-version }}" >&2
            exit 1
          fi

      - id: release-tag
        name: Verify release tag
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        uses: jfrz38/verify-release-tag@d3335c1a4307cd5241653aeecb579325d92fcd8f # v0.1.0
        with:
          version-file: ${{ matrix.package.package_file }}
          tag-prefix: ${{ matrix.package.tag_prefix }}
          expected-commit: ${{ github.sha }}
          policy: allow-missing

      - name: Install pnpm
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.1.3

      - name: Setup Node
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        run: make install-code

      - name: Install pinned Rust component tools
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true' && matrix.package.package_key == 'node'
        run: make install-node-component-tools

      - name: Verify stable component provenance
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true' && matrix.package.package_key == 'node'
        run: make verify-node-component

      - name: Build
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        run: make build-${{ matrix.package.package_key }}

      - name: Lint workspace
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        run: make lint

      - name: Run tests
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        run: make test-${{ matrix.package.package_key }}

      - name: Run Node conformance and package smoke
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true' && matrix.package.package_key == 'node'
        run: make test-node-conformance test-node-package

      - name: Smoke test installed consumer tarballs
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true' && matrix.package.package_key != 'node'
        run: make test-consumer-packages

      - name: Create GitHub release
        if: steps.publication-policy.outputs.publishable == 'true' && steps.version-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.tag }}
          VERSION: ${{ steps.release-tag.outputs.version }}
        working-directory: .
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists but the GitHub release is missing; creating it."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --latest=false
