name: Build Fastify Adapter

on:
  pull_request:
    branches: [main, develop, feat/fastify-and-nest-multiplatform]
    paths:
      - "code/hosts/node/**"
      - "code/adapters/shared/**"
      - "code/adapters/fastify/**"
      - "code/package.json"
      - "code/pnpm-lock.yaml"
      - "code/pnpm-workspace.yaml"
      - "Makefile"
      - ".github/workflows/build-fastify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fastify 5 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - name: Validate Fastify
        run: make validate-fastify
