name: Build NestJS Adapter
on:
  pull_request:
    branches: [main, develop, feat/fastify-and-nest-multiplatform]
    paths:
      - "code/hosts/node/**"
      - "code/adapters/shared/**"
      - "code/adapters/nestjs/**"
      - "code/package.json"
      - "code/pnpm-lock.yaml"
      - "code/pnpm-workspace.yaml"
      - "Makefile"
      - ".github/workflows/build-nestjs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: NestJS ${{ matrix.nestjs }} Express and Fastify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - nestjs: 10
            nestjs_version: 10.4.22
          - nestjs: 11
            nestjs_version: 11.2.3
          - nestjs: 12
            nestjs_version: 12.3.2
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install dependencies
        run: make install-code

      - name: Install NestJS compatibility version
        run: >-
          pnpm --dir code --filter "@jfrz38/pid-controller-nestjs" add --save-dev --save-exact
          @nestjs/common@${{ matrix.nestjs_version }}
          @nestjs/core@${{ matrix.nestjs_version }}
          @nestjs/platform-express@${{ matrix.nestjs_version }}
          @nestjs/platform-fastify@${{ matrix.nestjs_version }}

      - name: Validate NestJS on Express and Fastify
        run: make validate-nestjs PNPM_INSTALL_FLAGS="--no-frozen-lockfile --config.confirmModulesPurge=false"

      - name: Smoke test installed consumer tarballs
        run: make test-consumer-packages
        env:
          SMOKE_NEST_VERSION: ${{ matrix.nestjs_version }}
